<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SolSim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 360px; min-height: 480px; background: #0a0b0d; color: #e2e8f0; }
    body { font-family: 'JetBrains Mono', monospace; overflow-x: hidden; }
    #popup-root { width: 360px; }

    @keyframes slide-up   { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulse-dot  { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
    @keyframes count-in   { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <script type="module" crossorigin src="./index.js"></script>
</head>
<body>
  <div id="popup-root"></div>
</body>
</html>
